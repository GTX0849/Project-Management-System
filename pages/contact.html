<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="../style/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">Task<span>Flow</span></div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="about.html">About Us</a>
      <a href="contact.html" class="btn btn-primary">Contact Us</a>
    </div>
  </nav>

  <div class="center-wrapper">
    <div class="card form-card">
      <div class="section-header" style="text-align: left; margin-bottom: 40px;">
        <span class="badge">Reach Out</span>
        <h2 style="margin-bottom: 8px;">Let's build together.</h2>
        <p>Have a project in mind? We'd love to hear from you.</p>
      </div>
      
      <form>
        <div class="grid-2">
          <div class="form-group">
            <label for="fname">First Name</label>
            <input type="text" id="fname" placeholder="Jane">
          </div>
          <div class="form-group">
            <label for="lname">Last Name</label>
            <input type="text" id="lname" placeholder="Doe">
          </div>
        </div>
        
        <div class="form-group">
          <label for="email">Work Email</label>
          <input type="email" id="email" placeholder="jane@company.com">
        </div>
        
        <div class="form-group">
          <label for="message">Project Details</label>
          <textarea id="message" placeholder="Tell us a little about what you're looking to achieve..." rows="4"></textarea>
        </div>
        
        <button type="button" class="btn btn-primary" style="width: 100%;">Send Message</button>
      </form>
    </div>
  </div>

</body>
</html>
