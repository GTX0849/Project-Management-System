<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Secure Portal</title>
  <link rel="stylesheet" href="../style/style.css">
</head>
<body>

  <div class="center-wrapper">
    <div class="card login-card">
      <div style="text-align: center; margin-bottom: 32px;">
        <h2 style="color: var(--teal);">Welcome Back</h2>
        <p>Sign in to continue to your dashboard.</p>
      </div>
      
      <form>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@company.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••">
        </div>
        <button type="button" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Sign In</button>
      </form>
      
      <p style="text-align: center; margin-top: 24px; font-size: 14px;">
        Don't have an account? <a href="#" style="color: var(--teal); font-weight: 600;">Create one</a>
      </p>
    </div>
  </div>

</body>
</html>
