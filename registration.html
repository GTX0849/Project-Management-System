<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        teal: 'var(--teal)',
                        orange: 'var(--orange)',
                        cyan: 'var(--cyan)',
                        white: 'var(--white)',
                        tealDark: 'var(--teal-dark)',
                        orangeDark: 'var(--orange-dark)',
                        textDark: 'var(--text-dark)',
                        textMuted: 'var(--text-muted)',
                        bgMain: 'var(--bg-main)',
                        bgCard: 'var(--bg-card)',
                        borderLight: 'var(--border-light)'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    boxShadow: {
                        sm: 'var(--shadow-sm)',
                        md: 'var(--shadow-md)',
                        hover: 'var(--shadow-hover)',
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans antialiased min-h-screen p-4 md:p-8 flex flex-col items-center justify-center">

    <div class="w-full max-w-3xl bg-bgCard rounded-xl shadow-md p-6 md:p-10 transition-shadow duration-300 hover:shadow-hover">
        <h1 class="text-3xl font-bold text-teal mb-2">Join the Workspace</h1>
        <p class="text-textMuted mb-8">Register for the Project Management System.</p>

        <form id="registrationForm" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <div>
                    <label class="block text-sm font-semibold mb-2" for="fullName">Full Name</label>
                    <input type="text" id="fullName" required placeholder="John Doe"
                        class="w-full px-4 py-2 border border-borderLight rounded-lg focus:outline-none focus:border-teal focus:ring-1 focus:ring-teal transition-colors">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2" for="email">Work Email</label>
                    <input type="email" id="email" required placeholder="john@company.com"
                        class="w-full px-4 py-2 border border-borderLight rounded-lg focus:outline-none focus:border-teal focus:ring-1 focus:ring-teal transition-colors">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2" for="password">Password</label>
                    <input type="password" id="password" required minlength="8" placeholder="Min 8 characters"
                        class="w-full px-4 py-2 border border-borderLight rounded-lg focus:outline-none focus:border-teal focus:ring-1 focus:ring-teal transition-colors">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2" for="role">System Role</label>
                    <select id="role" required
                        class="w-full px-4 py-2 border border-borderLight rounded-lg focus:outline-none focus:border-teal focus:ring-1 focus:ring-teal transition-colors bg-white">
                        <option value="" disabled selected>Select a role...</option>
                        <option value="Project Manager">Project Manager</option>
                        <option value="Developer">Developer</option>
                        <option value="Designer">Designer</option>
                        <option value="Stakeholder">Stakeholder</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2" for="joinDate">Expected Joining Date</label>
                    <input type="date" id="joinDate" required
                        class="w-full px-4 py-2 border border-borderLight rounded-lg focus:outline-none focus:border-teal focus:ring-1 focus:ring-teal transition-colors">
                </div>

            </div>

            <button type="submit" 
                class="w-full md:w-auto px-8 py-3 bg-teal text-white font-semibold rounded-lg shadow-sm hover:bg-tealDark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal transition-colors">
                Register User
            </button>
        </form>
    </div>

    <ul id="employeeListContainer" class="mt-4 space-y-2"></ul>

    <script src="js/script.js"></script>
</body>
</html>
